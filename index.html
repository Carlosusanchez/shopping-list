<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        <!-- Main Application Title -->
        <h1 class="main-title">Digital Shopping List</h1>

        <div class="interface-layout">
            
            <!-- Left Controls Sidebar -->
            <section class="controls-left" aria-label="List Adjustments">
                <button class="btn btn-orange">Add Item <span class="plus-icon">+</span></button>
                <button class="btn btn-orange">Sort List</button>
                <p class="help-text">Orders list by bullet points, numbers, or uncompleted items.</p>
            </section>

            <!-- Center Shopping List Container -->
            <section class="list-display-box">
                <h2 class="list-title">List Title</h2>
                
                <ul class="shopping-list">
                    <!-- Standard Item -->
                    <li class="list-item main-item">
                        <span class="status-circle"></span>
                        <div class="item-text-box purple-bg">Item Name</div>
                    </li>
                    
                    <!-- Sub Item -->
                    <li class="list-item sub-item">
                        <span class="status-square"></span>
                        <div class="item-text-box pink-bg">Sub Item Name</div>
                    </li>

                    <li class="list-item main-item">
                        <span class="status-circle"></span>
                        <div class="item-text-box purple-bg">Item Name</div>
                    </li>

                    <!-- Completed Crossed-Off Item Example -->
                    <li class="list-item main-item completed">
                        <span class="status-circle filled"></span>
                        <div class="item-text-box purple-bg struck-through">Item Name</div>
                    </li>
                    
                    <li class="list-item sub-item">
                        <span class="status-square"></span>
                        <div class="item-text-box pink-bg">Sub Item Name</div>
                    </li>
                </ul>
            </section>

            <!-- Right System Controls Sidebar -->
            <section class="controls-right" aria-label="List Management">
                <button class="btn btn-blue">New List</button>
                <button class="btn btn-teal">Change List</button>
                <button class="btn btn-red delete-btn">Delete List</button>
            </section>

        </div>
    </main>

</body>
</html>
