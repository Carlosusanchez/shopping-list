<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Shopping Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        <!-- Main Application Header - Clicking this safely routes back to Homepage -->
        <h1 class="main-title" id="homeLink">Digital Shopping Tracker</h1>

        <div class="interface-layout">
            
            <!-- Left Side Control Panel Interface Dynamic Slot -->
            <section class="controls-left" id="leftSidebar" aria-label="List Adjustments"></section>

            <!-- Center White Board Content Container Area -->
            <section class="list-display-box" id="mainDisplayBox"></section>

            <!-- Right Side Control Panel Interface Dynamic Slot -->
            <section class="controls-right" id="rightSidebar" aria-label="List Management"></section>

        </div>
    </main>

    <!-- Code Injector Function Engine Link -->
    <script src="script.js"></script>
</body>
</html>
