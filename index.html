<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        <!-- Main Application Title -->
        <h1 class="main-title">Digital Shopping List</h1>

        <div class="interface-layout">
            
            <!-- Left Controls Sidebar (Sentence Removed) -->
            <section class="controls-left" aria-label="List Adjustments">
                <button class="btn btn-orange" id="addItemBtn">Add Item <span class="plus-icon">+</span></button>
                <button class="btn btn-orange" id="sortBtn">Sort List</button>
            </section>

            <!-- Center Shopping List Container -->
            <section class="list-display-box">
                <h2 class="list-title">List Title</h2>
                
                <!-- This container is empty and ready for dynamic sorting -->
                <ul class="shopping-list" id="shoppingList"></ul>
            </section>

            <!-- Right System Controls Sidebar -->
            <section class="controls-right" aria-label="List Management">
                <button class="btn btn-blue">New List</button>
                <button class="btn btn-teal">Change List</button>
                <button class="btn btn-red delete-btn">Delete List</button>
            </section>

        </div>
    </main>

    <!-- Connect the script functionality -->
    <script src="script.js"></script>
</body>
</html>
