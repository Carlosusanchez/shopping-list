<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        <!-- Main Application Title (Clicking returns to Home) -->
        <h1 class="main-title" id="homeLink" style="cursor: pointer;">Digital Shopping Tracker</h1>

        <div class="interface-layout">
            
            <!-- Left Controls Sidebar -->
            <section class="controls-left" id="leftSidebar" aria-label="List Adjustments">
                <button class="btn btn-orange" id="addItemBtn">Add Item <span class="plus-icon">+</span></button>
                <button class="btn btn-orange" id="sortBtn">Sort List</button>
            </section>

            <!-- Center Display Area -->
            <section class="list-display-box">
                
                <!-- 🏠 VIEW 1: HOME PAGE CONTAINER -->
                <div id="homePageContainer">
                    <h2 class="list-title">Select a Shopping List</h2>
                    <div class="dashboard-grid" id="homepageGrid"></div>
                </div>

                <!-- 🛒 VIEW 2: ACTIVE SHOPPING LIST CONTAINER -->
                <div id="shoppingListContainer" style="display: none;">
                    <h2 class="list-title" id="listTitleElement">List Title</h2>
                    <ul class="shopping-list" id="shoppingList"></ul>
                </div>

            </section>

            <!-- Right System Controls Sidebar -->
            <section class="controls-right" aria-label="List Management">
                <button class="btn btn-blue" id="newListBtn">New List</button>
                <button class="btn btn-teal" id="goHomeBtn">Go to Homepage</button>
                <button class="btn btn-red delete-btn" id="deleteListBtn">Delete List</button>
            </section>

        </div>
    </main>

    <!-- Connect the script functionality -->
    <script src="script.js"></script>
</body>
</html>
