<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Shopping Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        <!-- Clicking this title returns you to the true Homepage -->
        <h1 class="main-title" id="homeLink">Digital Shopping Tracker</h1>

        <div class="interface-layout">
            
            <!-- Left Controls Sidebar (hidden on Homepage) -->
            <section class="controls-left" id="leftSidebar" aria-label="List Adjustments">
                <button class="btn btn-orange" id="addItemBtn">Add Item <span class="plus-icon">+</span></button>
                <button class="btn btn-orange" id="sortBtn">Sort List</button>
            </section>

            <!-- Center Display Area (Switches between Homepage Grid & List Views) -->
            <section class="list-display-box" id="mainDisplayBox">
                <!-- Javascript injects the home dashboard or active list items here -->
            </section>

            <!-- Right System Controls Sidebar -->
            <section class="controls-right" aria-label="List Management">
                <button class="btn btn-blue" id="newListBtn">New List</button>
                <button class="btn btn-teal" id="dashboardBtn">Go to Homepage</button>
                <button class="btn btn-red delete-btn" id="deleteListBtn">Delete Current List</button>
            </section>

        </div>
    </main>

    <!-- Connect the script functionality -->
    <script src="script.js"></script>
</body>
</html>
